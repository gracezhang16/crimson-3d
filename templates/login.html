{% extends "layout.html" %}

{% block title %}Log in{% endblock %}

{% block main %}
    <div class="mx-auto narrow-form">
        <h1 class="h3 mb-3">Log in</h1>

        {% if error %}
            <div class="alert alert-danger" role="alert">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('pages.login') }}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input id="email" name="email" type="email" class="form-control"
                       value="{{ email or '' }}" autocomplete="email" required autofocus>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input id="password" name="password" type="password" class="form-control"
                       autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-crimson w-100">Log in</button>
        </form>

        <p class="mt-3 small">New here? <a href="{{ url_for('pages.register') }}">Create an account</a></p>
    </div>
{% endblock %}

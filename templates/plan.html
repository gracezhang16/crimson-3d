{% extends "layout.html" %}

{# The 3D planner page (Claire). SPEC.md 8.1: data reaches the JavaScript only
   through the data-* attributes on #planner, never as inline <script> data.
   main.js reads them with element.dataset (data-type-id -> dataset.typeId). #}

{% block title %}{{ suite_type.name }} · Planner{% endblock %}

{% block head %}
    <link href="{{ url_for('static', filename='css/planner.css') }}" rel="stylesheet">
{% endblock %}

{# Full width, no padding: the planner fills the space between navbar and footer. #}
{% block main_class %}d-flex{% endblock %}

{% block main %}
    <div id="planner" class="planner"
         data-type-id="{{ suite_type.id }}"
         data-layout-id="{{ layout_id }}"
         data-mode="{{ mode }}"
         data-logged-in="{{ 'true' if user else 'false' }}">

        <aside class="planner-panel">
            <section>
                <h1 class="h5 mb-0">{{ suite_type.name }}</h1>
                <a class="small" href="{{ url_for('pages.suite_type', type_id=suite_type.id) }}">{{ suite_type.dorm_name }} · suite facts</a>
                {% if suite_type.status == "draft" %}
                    <span class="badge text-bg-warning align-self-start">Draft</span>
                {% endif %}
            </section>
            {# Layout controls (SPEC.md 8.6), placed near the top so Save is in view
               without scrolling the panel. saving.js wires them up. #}
            <section id="layout-controls">
                {% if mode == "admin-default" %}
                    <h2 class="planner-heading">Default layout</h2>
                    <p class="small text-body-secondary mb-1">Visitors see this arrangement first when they open the room.</p>
                    <div class="d-flex align-items-center gap-2">
                        <button type="button" class="btn btn-sm btn-crimson" id="save-default-button">Save default layout</button>
                        <span id="save-status" class="small" aria-live="polite"></span>
                    </div>
                    <p id="save-error" class="small text-danger mb-0" role="alert" hidden></p>
                {% elif user %}
                    <h2 class="planner-heading">Your layout</h2>
                    <label for="layout-name" class="form-label small mb-0">Name</label>
                    <input id="layout-name" class="form-control form-control-sm" maxlength="60" autocomplete="off">
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <button type="button" class="btn btn-sm btn-crimson" id="save-button">Save</button>
                        <button type="button" class="btn btn-sm btn-outline-secondary" id="save-as-new-button">Save as new</button>
                        <span id="save-status" class="small" aria-live="polite"></span>
                    </div>
                    <p id="save-error" class="small text-danger mb-0" role="alert" hidden></p>
                    <p class="small mb-0 mt-1">Your layouts for this room:</p>
                    <ul class="small mb-0 ps-3" id="saved-layouts"></ul>
                {% else %}
                    <h2 class="planner-heading">Your layout</h2>
                    <p class="small mb-0">
                        <a href="{{ url_for('pages.login') }}">Log in to save this layout</a>
                        or <a href="{{ url_for('pages.register') }}">create an account</a>.
                        You can move furniture without one, but it won't be kept.
                    </p>
                {% endif %}
            </section>

            {# Suites with several rooms: point the camera at one room (main.js).
               Hidden for a one-room suite. #}
            <section id="room-focus" hidden>
                <h2 class="planner-heading">Rooms</h2>
                <div class="d-flex flex-wrap gap-1" id="room-focus-buttons" role="group" aria-label="Look at a room"></div>
                <p class="small text-body-secondary mb-0">
                    Pick a room to look into it, or turn the view: walls between you and a room drop out of the way.
                </p>
            </section>

            {# Filled by panel.js. Hidden until an item is selected. #}
            <section id="selection" hidden>
                <h2 class="planner-heading">Selected</h2>
                <p class="mb-0 fw-semibold" id="selection-name"></p>
                <p class="small text-body-secondary mb-1" id="selection-size"></p>
                <p class="small mb-1 issue-text" id="selection-issue" hidden></p>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="rotate-button">Rotate 90°</button>
                    <button type="button" class="btn btn-sm btn-outline-danger" id="delete-button">Delete</button>
                </div>
                <p class="small text-body-secondary mb-0">
                    Drag to move. <kbd>R</kbd> turns, arrow keys nudge 1 in
                    (<kbd>Shift</kbd> for 6 in), <kbd>Delete</kbd> removes, <kbd>Esc</kbd> deselects.
                </p>
            </section>
            <section>
                <h2 class="planner-heading">Harvard furniture</h2>
                <div class="catalog-grid" id="catalog-harvard"></div>
            </section>
            <section>
                <h2 class="planner-heading">Things to buy</h2>
                <div class="catalog-grid" id="catalog-purchase"></div>
            </section>
            {# "Will it fit?" (SPEC.md 8.6): try any item by its size. panel.js checks
               it (rules.checkCustomItem) and adds it as a custom item. #}
            <section id="will-it-fit">
                <h2 class="planner-heading">Will it fit?</h2>
                <form id="custom-form" class="custom-grid" novalidate>
                    <div class="custom-wide">
                        <label for="custom-name" class="form-label small mb-0">Name</label>
                        <input id="custom-name" class="form-control form-control-sm" maxlength="60" placeholder="e.g. Bean bag chair" autocomplete="off">
                    </div>
                    <div>
                        <label for="custom-width" class="form-label small mb-0">Width (in)</label>
                        <input id="custom-width" class="form-control form-control-sm" type="number" min="1" max="200" step="1" inputmode="numeric">
                    </div>
                    <div>
                        <label for="custom-depth" class="form-label small mb-0">Depth (in)</label>
                        <input id="custom-depth" class="form-control form-control-sm" type="number" min="1" max="200" step="1" inputmode="numeric">
                    </div>
                    <div>
                        <label for="custom-height" class="form-label small mb-0">Height (in)</label>
                        <input id="custom-height" class="form-control form-control-sm" type="number" min="1" max="120" step="1" inputmode="numeric">
                    </div>
                    <p id="custom-error" class="custom-wide small text-danger mb-0" role="alert" hidden></p>
                    <button type="submit" class="btn btn-sm btn-crimson custom-wide">Add to the suite</button>
                </form>
            </section>
            <section>
                <h2 class="planner-heading">In this suite <span id="room-item-count"></span></h2>
                {# A button per item, so items can be selected with the keyboard too. #}
                <ul class="list-unstyled mb-0 room-items" id="room-items"></ul>
            </section>
            <section>
                <h2 class="planner-heading">Moving around</h2>
                <p class="small text-body-secondary mb-0">
                    Drag the room to turn it. Scroll or pinch to zoom.
                    Right-drag or two-finger drag to slide the view.
                </p>
            </section>
        </aside>

        <div class="planner-scene">
            {# main.js replaces this canvas with a message if WebGL is unavailable. #}
            <canvas id="scene" aria-label="3D view of the room"></canvas>
            {# View controls (SPEC.md 8.7): 3D or floor plan, and zoom for people
               without a scroll wheel. main.js wires them up. #}
            <div class="scene-tools" role="toolbar" aria-label="View">
                <div class="btn-group btn-group-sm" role="group" aria-label="View mode">
                    <button type="button" class="btn btn-light" data-view="3d" aria-pressed="true">3D</button>
                    <button type="button" class="btn btn-light" data-view="plan" aria-pressed="false">Floor plan</button>
                </div>
                <div class="btn-group btn-group-sm" role="group" aria-label="Zoom">
                    <button type="button" class="btn btn-light" data-zoom="in" aria-label="Zoom in">+</button>
                    <button type="button" class="btn btn-light" data-zoom="out" aria-label="Zoom out">−</button>
                </div>
            </div>
            {# "Everything fits" or "N items don't fit" (SPEC.md 4.5 rule 8); panel.js
               fills it, and screen readers announce changes. #}
            <div id="fit-status" class="fit-pill" role="status" aria-live="polite" hidden></div>
        </div>
    </div>
{% endblock %}

{% block scripts %}
    <script type="module" src="{{ url_for('static', filename='js/planner/main.js') }}"></script>
{% endblock %}
